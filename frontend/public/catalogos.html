<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogos del campo · OrbitLens</title>
<style>body{margin:0;background:#102428;color:#f2f4df;font:16px/1.5 system-ui}main{max-width:960px;margin:auto;padding:1rem}#atlas{width:100%;height:65vh}a{color:#dcf57c}</style>
<main><h1>Catálogos del campo</h1><p id="info" role="status">Cargando el mapa de Aladin Lite…</p><div id="atlas"></div><p>Gaia DR3 aparece en cian y AllWISE en naranja. Las posiciones de catálogo pueden corresponder a épocas distintas de las imágenes de SPHEREx.</p><a id="external" hidden>Consultar este campo directamente en Aladin</a> · <a href="/">Volver a OrbitLens</a></main>
<script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>
<script>
async function start(){
 const q=new URLSearchParams(location.search);
 if(!['ra','dec','fov'].every(k=>q.has(k)&&q.get(k).trim())) throw Error('Faltan coordenadas o campo de visión.');
 const [ra,dec,fov]=['ra','dec','fov'].map(k=>Number(q.get(k)));
 if(!(ra>=0&&ra<360&&dec>=-90&&dec<=90&&fov>=1&&fov<=30)) throw Error('Campo fuera de rango.');
 const external=document.querySelector("#external");
 external.href="https://aladin.cds.unistra.fr/AladinLite/?"+new URLSearchParams({target:ra+" "+dec,fov:String(fov/60)});
 external.hidden=false;
 await A.init;
 const center=ra+' '+dec;
 const field=A.aladin('#atlas',{target:center,fov:fov/60,cooFrame:'ICRSd',survey:'P/DSS2/color'});
 for(const [id,name,color] of [['I/355/gaiadr3','Gaia DR3','#6df0fa'],['II/328/allwise','AllWISE','#ffa45c']]){
   field.addCatalog(A.catalogFromVizieR(id,center,fov/60/Math.sqrt(2),{name,color,sourceSize:6,onClick:'showTable'}));
 }
 document.querySelector('#info').textContent='Centro ICRS '+center+' grados · campo '+fov+'′. Las capas se consultan en CDS.';
}
start().catch(e=>document.querySelector('#info').textContent='Mapa externo no disponible. '+e.message);
</script></html>
